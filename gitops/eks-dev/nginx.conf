map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    # ALB / Kubernetes health check.
    # Does not depend on Django, RDS, Redis, or authentication.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django static files.
    location /static/ {
        alias /static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Application traffic -> Gunicorn / Django.
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve HTTPS information received from the ALB.
        # Falls back to the local scheme for port-forward/testing.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
