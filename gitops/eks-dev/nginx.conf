map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    # ALB / Kubernetes health check.
    # Does not depend on Django, RDS, Redis, or authentication.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django static files.
    location /static/ {
        alias /static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Internal authorization subrequest for the Grafana gateway.
    # External requests cannot call this location directly.
    location = /plugins/aegis/grafana-auth/ {
        internal;

        proxy_pass http://127.0.0.1:8000/plugins/aegis/grafana-auth/;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Staff-only Grafana gateway. Grafana remains a private ClusterIP service;
    # Nginx injects the identity returned by the Django authorization endpoint.
    location ^~ /plugins/aegis/grafana/ {
        auth_request /plugins/aegis/grafana-auth/;
        auth_request_set $aegis_grafana_user $upstream_http_x_webauth_user;

        proxy_pass http://aegis-monitoring-grafana.monitoring.svc.cluster.local;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /plugins/aegis/grafana;
        proxy_set_header X-WEBAUTH-USER $aegis_grafana_user;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # Application traffic -> Gunicorn / Django.
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve HTTPS information received from the ALB.
        # Falls back to the local scheme for port-forward/testing.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
