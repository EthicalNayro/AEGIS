apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-external-dns
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-external-dns
    app.kubernetes.io/part-of: aegis
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-external-dns
  namespace: aegis-system
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-external-dns
  namespace: aegis-system
subjects:
  - kind: ServiceAccount
    name: aegis-external-dns
    namespace: aegis-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis-external-dns
