apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-external-dns
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-external-dns
    app.kubernetes.io/part-of: aegis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-external-dns
        app.kubernetes.io/part-of: aegis
    spec:
      serviceAccountName: aegis-external-dns
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          imagePullPolicy: IfNotPresent
          args:
            - --source=ingress
            - --provider=webhook
            - --webhook-provider-url=http://127.0.0.1:8888
            - --namespace=aegis-system
            - --label-filter=aegis-external-dns=true
            - --ingress-class=alb
            - --regex-domain-filter=^app[.]aegis-project[.]ddnsfree[.]com$
            - --managed-record-types=CNAME
            - --policy=upsert-only
            - --registry=noop
            - --interval=1m
            - --log-level=debug
            - --dry-run
          ports:
            - name: metrics
              containerPort: 7979
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 160Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: k8s-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp

        - name: dynu-webhook
          image: python:3.12-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /webhook/dynu-webhook.py
          env:
            - name: DYNU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aegis-dynu-api
                  key: api-key
            - name: DYNU_ZONE
              value: aegis-project.ddnsfree.com
            - name: DYNU_HOSTNAME
              value: app.aegis-project.ddnsfree.com
            - name: DYNU_ALLOWED_TARGET_SUFFIX
              value: .elb.amazonaws.com
            - name: DYNU_DEFAULT_TTL
              value: "120"
            - name: LOG_LEVEL
              value: INFO
          ports:
            - name: webhook-health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook-health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook-health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: webhook-code
              mountPath: /webhook
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: webhook-code
          configMap:
            name: aegis-dynu-external-dns-webhook
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: k8s-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
