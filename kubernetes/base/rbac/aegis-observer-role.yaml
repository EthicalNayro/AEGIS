apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-observer
  namespace: aegis-system
  labels:
    app.kubernetes.io/part-of: aegis
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
