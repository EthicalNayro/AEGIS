apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-grafana-dashboard-platform-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: aegis-platform-health
    app.kubernetes.io/part-of: aegis-observability
data:
  aegis-platform-health.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Status-Page Available Replicas",
          "id": 1,
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"aegis-system\",deployment=\"aegis-status-page\"}"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "Analyzer Available Replicas",
          "id": 2,
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"aegis-system\",deployment=\"aegis-security-analyzer\"}"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "RQ Worker Available Replicas",
          "id": 3,
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"aegis-system\",deployment=\"aegis-status-page-rq\"}"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "Scheduler Available Replicas",
          "id": 4,
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"aegis-system\",deployment=\"aegis-status-page-scheduler\"}"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "Ready Kubernetes Nodes",
          "id": 5,
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "AEGIS Restarts (1h)",
          "id": 6,
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"aegis-system\"}[1h]))"}],
          "fieldConfig": {"defaults": {"decimals": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "timeseries",
          "title": "Status-Page CPU Usage",
          "id": 7,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"aegis-system\",pod=~\"aegis-status-page-[0-9a-f]+-.*\",container!=\"\",container!=\"POD\"}[5m]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "cores", "min": 0}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Status-Page Memory Working Set",
          "id": 8,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"aegis-system\",pod=~\"aegis-status-page-[0-9a-f]+-.*\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}, "overrides": []}
        },
        {
          "type": "bargauge",
          "title": "AEGIS Deployment Availability",
          "id": 9,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "100 * kube_deployment_status_replicas_available{namespace=\"aegis-system\"} / clamp_min(kube_deployment_spec_replicas{namespace=\"aegis-system\"}, 1)", "legendFormat": "{{deployment}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}
        },
        {
          "type": "bargauge",
          "title": "Pod Density per Node",
          "id": 10,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{"refId": "A", "expr": "100 * count by (node) (kube_pod_info{node!=\"\"}) / on(node) kube_node_status_allocatable{resource=\"pods\"}", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["aegis", "kubernetes", "observability"],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "hide": 2,
            "refresh": 1
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "AEGIS Platform Health",
      "uid": "aegis-platform-health",
      "version": 1
    }
