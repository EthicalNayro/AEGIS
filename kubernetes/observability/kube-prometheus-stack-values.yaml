# AEGIS kube-prometheus-stack values
# Purpose: Kubernetes/workload observability for the EKS dev environment.
# AWS/WAF/ALB security telemetry remains in CloudWatch.

alertmanager:
  enabled: false

grafana:
  enabled: true

  admin:
    existingSecret: aegis-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: false

  service:
    type: ClusterIP

  persistence:
    enabled: false

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser

  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 512Mi

  grafana.ini:
    server:
      domain: app.aegis-project.ddnsfree.com
      root_url: https://%(domain)s/plugins/aegis/grafana/
      serve_from_sub_path: true
    security:
      allow_embedding: true
    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer
    auth.proxy:
      enabled: true
      header_name: X-WEBAUTH-USER
      header_property: username
      auto_sign_up: true
      sync_ttl: 15
      enable_login_token: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false

prometheus:
  enabled: true
  prometheusSpec:
    retention: 3d
    scrapeInterval: 30s
    evaluationInterval: 30s
    enableAdminAPI: false
    walCompression: true

    resources:
      requests:
        cpu: 300m
        memory: 700Mi
      limits:
        cpu: "1"
        memory: 1500Mi

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 150Mi
    limits:
      cpu: 500m
      memory: 400Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# Node exporter must run on every current node, including when a node reaches
# its pod-density limit. Use Kubernetes' built-in cluster-critical priority so
# node-level telemetry can preempt a lower-priority workload rather than leave
# the observability DaemonSet permanently Progressing under scheduling pressure.
prometheus-node-exporter:
  priorityClassName: system-cluster-critical

# Keep the observability AppProject confined to the monitoring namespace.
# kube-prometheus-stack otherwise creates discovery Services in kube-system
# for these components. We do not need those targets for the AEGIS project
# dashboards, so disable them instead of broadening the GitOps trust boundary.
coreDns:
  enabled: false

kubeProxy:
  enabled: false

# EKS manages these control-plane components and does not expose their
# local metrics endpoints like a self-managed Kubernetes control plane.
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
