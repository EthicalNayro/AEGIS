apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-scale-test
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: karpenter-scale-test
    app.kubernetes.io/part-of: aegis

spec:
  replicas: 6

  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter-scale-test

  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpenter-scale-test
        app.kubernetes.io/part-of: aegis

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: workload
          image: public.ecr.aws/docker/library/busybox:1.36

          command:
            - sh
            - -c
            - sleep 3600

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 900m
              memory: 512Mi
            limits:
              cpu: 900m
              memory: 512Mi
