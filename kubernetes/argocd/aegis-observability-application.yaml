apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-observability
  namespace: argocd
spec:
  project: aegis-observability

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.1
      helm:
        releaseName: aegis-monitoring
        valueFiles:
          - $values/kubernetes/observability/kube-prometheus-stack-values.yaml

    - repoURL: https://github.com/EthicalNayro/AEGIS.git
      targetRevision: phase-1-1/platform-modernization
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
