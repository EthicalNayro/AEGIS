apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-observability
  namespace: argocd
spec:
  description: AEGIS observability stack deployment boundary

  sourceRepos:
    - https://prometheus-community.github.io/helm-charts
    - https://github.com/EthicalNayro/AEGIS.git

  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc

  # kube-prometheus-stack needs a small, explicit set of cluster-scoped
  # resources for the Prometheus Operator, CRDs and cluster-level RBAC.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

  # Namespaced resources are confined to the monitoring namespace above.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
