apiVersion: v1
kind: Pod
metadata:
  name: aegis-analyzer-identity-test
  namespace: aegis-system
spec:
  restartPolicy: Never
  serviceAccountName: aegis-security-analyzer

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: aws-cli
      image: public.ecr.aws/aws-cli/aws-cli:2.31.35

      args:
        - sts
        - get-caller-identity
        - --region
        - us-east-1
        - --output
        - json

      env:
        - name: HOME
          value: /tmp

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

      volumeMounts:
        - name: tmp
          mountPath: /tmp

  volumes:
    - name: tmp
      emptyDir: {}
