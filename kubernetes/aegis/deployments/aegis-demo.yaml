apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-demo
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-demo
    app.kubernetes.io/part-of: aegis

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-demo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-demo
        app.kubernetes.io/part-of: aegis

    spec:
      serviceAccountName: aegis-runtime

      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-demo
          matchLabelKeys:
            - pod-template-hash

        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-demo
          matchLabelKeys:
            - pod-template-hash

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: aegis-demo
          image: public.ecr.aws/docker/library/busybox:1.36

          command:
            - httpd
            - -f
            - -p
            - "8080"
            - -h
            - /www

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 15

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: web-content
              mountPath: /www
              readOnly: true

      volumes:
        - name: web-content
          configMap:
            name: aegis-demo-content
