apiVersion: v1
kind: Pod
metadata:
  name: aegis-load-generator
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-load-generator
    app.kubernetes.io/part-of: aegis

spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: load-generator
      image: public.ecr.aws/docker/library/busybox:1.36

      command:
        - sh
        - -c
        - |
          while true; do
            for i in 1 2 3 4 5 6 7 8; do
              wget -q -O- http://aegis-demo.aegis-system.svc.cluster.local/ >/dev/null &
            done
            wait
          done

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 200m
          memory: 32Mi
