apiVersion: v1
kind: Pod
metadata:
  name: insecure-demo
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: insecure-demo

spec:
  restartPolicy: Never

  containers:
    - name: insecure
      image: public.ecr.aws/docker/library/busybox:1.36

      command:
        - sh
        - -c
        - sleep 3600

      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
