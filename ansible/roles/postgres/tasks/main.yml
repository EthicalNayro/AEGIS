---
- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create Status-Page database user
  community.postgresql.postgresql_user:
    name: "{{ status_page_db_user }}"
    password: "{{ status_page_db_password }}"
    state: present
  become_user: postgres

- name: Create Status-Page database
  community.postgresql.postgresql_db:
    name: "{{ status_page_db_name }}"
    owner: "{{ status_page_db_user }}"
    state: present
  become_user: postgres

- name: Create AEGIS database user
  community.postgresql.postgresql_user:
    name: "{{ aegis_db_user }}"
    password: "{{ aegis_db_password }}"
    state: present
  become_user: postgres
  no_log: true

- name: Create AEGIS database
  community.postgresql.postgresql_db:
    name: "{{ aegis_db_name }}"
    owner: "{{ aegis_db_user }}"
    state: present
  become_user: postgres

- name: Get PostgreSQL configuration file path
  ansible.builtin.command:
    cmd: psql -tAc "SHOW config_file;"
  become_user: postgres
  register: postgresql_config_file
  changed_when: false

- name: Get PostgreSQL HBA file path
  ansible.builtin.command:
    cmd: psql -tAc "SHOW hba_file;"
  become_user: postgres
  register: postgresql_hba_file
  changed_when: false

- name: Allow AEGIS application to connect to PostgreSQL
  ansible.builtin.lineinfile:
    path: "{{ postgresql_hba_file.stdout | trim }}"
    line: "host    {{ aegis_db_name }}    {{ aegis_db_user }}    {{ status_page_app_private_ip }}/32    scram-sha-256"
    insertafter: EOF
  notify: Restart PostgreSQL

- name: Allow PostgreSQL to listen on network interfaces
  ansible.builtin.lineinfile:
    path: "{{ postgresql_config_file.stdout | trim }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Allow Status-Page application to connect to PostgreSQL
  ansible.builtin.lineinfile:
    path: "{{ postgresql_hba_file.stdout | trim }}"
    line: "host    {{ status_page_db_name }}    {{ status_page_db_user }}    {{ status_page_app_private_ip }}/32    scram-sha-256"
    insertafter: EOF
  notify: Restart PostgreSQL

- name: Create AEGIS incidents table
  community.postgresql.postgresql_query:
    login_db: "{{ aegis_db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS incidents (
          incident_id VARCHAR(128) PRIMARY KEY,
          status VARCHAR(32) NOT NULL,
          severity VARCHAR(32) NOT NULL,
          rule_id VARCHAR(128) NOT NULL,
          title TEXT NOT NULL,

          source VARCHAR(64) NOT NULL,
          source_event_id VARCHAR(255) NOT NULL,

          resource_type VARCHAR(128) NOT NULL,
          resource_id VARCHAR(255) NOT NULL,
          region VARCHAR(64),

          actor TEXT,
          actor_type VARCHAR(64),
          source_ip VARCHAR(255),

          event_time TIMESTAMPTZ NOT NULL,
          detected_at TIMESTAMPTZ NOT NULL,

          evidence JSONB NOT NULL DEFAULT '{}'::jsonb
      );

      ALTER TABLE incidents OWNER TO {{ aegis_db_user }};
  become_user: postgres

- name: Create AEGIS worker checkpoints table
  community.postgresql.postgresql_query:
    login_db: "{{ aegis_db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS worker_checkpoints (
          worker_name VARCHAR(128) PRIMARY KEY,
          last_successful_poll_at TIMESTAMPTZ NOT NULL,
          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      ALTER TABLE worker_checkpoints OWNER TO {{ aegis_db_user }};
  become_user: postgres
