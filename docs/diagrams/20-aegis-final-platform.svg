<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">AEGIS final platform architecture</title>
  <desc id="desc">Final accepted AEGIS architecture showing public edge, private Amazon EKS runtime, managed data services, AI security services, GitOps delivery and DNS safety boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7faff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1d4d" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1553e8"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title{font:800 40px Inter,Segoe UI,Arial,sans-serif;fill:#0b1d4d}.sub{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#1553e8}.section{font:800 15px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.5px;fill:#1553e8}.label{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#14213d}.small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#53627a}.tiny{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#14213d}.box{fill:#ffffff;stroke:#8db1ff;stroke-width:1.5}.aws{fill:#fffaf2;stroke:#f59e0b;stroke-width:1.5}.sec{fill:#fff8f8;stroke:#ef5c61;stroke-width:1.5}.git{fill:#faf8ff;stroke:#7955d8;stroke-width:1.5}.obs{fill:#f4fffd;stroke:#2ca7a0;stroke-width:1.5}.data{fill:#faf8ff;stroke:#8b6fe8;stroke-width:1.5}.cluster{fill:#ffffff;stroke:#8db1ff;stroke-width:2}.eks{fill:#f8fbff;stroke:#4383ef;stroke-width:2}.line{stroke:#1553e8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.muted{stroke:#64748b;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrowMuted)}
    </style>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <circle cx="1430" cy="90" r="190" fill="#1553e8" opacity=".025"/><circle cx="110" cy="850" r="220" fill="#7955d8" opacity=".025"/>
  <text x="800" y="62" text-anchor="middle" class="title">AEGIS – Platform Architecture</text>
  <text x="800" y="96" text-anchor="middle" class="sub">01 – Final EKS Runtime Architecture</text>

  <rect x="55" y="145" width="300" height="610" rx="24" class="cluster"/>
  <text x="80" y="180" class="section">PUBLIC EDGE</text>
  <rect x="90" y="215" width="230" height="74" rx="16" class="box" filter="url(#shadow)"/>
  <text x="205" y="245" text-anchor="middle" class="label">Users / Analysts</text><text x="205" y="267" text-anchor="middle" class="small">HTTPS clients</text>
  <rect x="90" y="330" width="230" height="74" rx="16" class="box"/>
  <text x="205" y="360" text-anchor="middle" class="label">Dynu DNS</text><text x="205" y="382" text-anchor="middle" class="small">app.aegis-project.ddnsfree.com</text>
  <rect x="90" y="455" width="230" height="110" rx="16" class="aws"/>
  <text x="205" y="487" text-anchor="middle" class="label">Application Load Balancer</text><text x="205" y="511" text-anchor="middle" class="small">Internet-facing · HTTPS :443</text>
  <rect x="110" y="528" width="82" height="24" rx="12" fill="#fff4f4" stroke="#ef5c61"/><text x="151" y="545" text-anchor="middle" class="tiny">AWS WAF</text>
  <rect x="210" y="528" width="82" height="24" rx="12" fill="#fff8e8" stroke="#f59e0b"/><text x="251" y="545" text-anchor="middle" class="tiny">ACM TLS</text>
  <rect x="90" y="620" width="230" height="82" rx="16" class="box"/>
  <text x="205" y="653" text-anchor="middle" class="label">Kubernetes Ingress</text><text x="205" y="676" text-anchor="middle" class="small">ALB controller target</text>
  <path d="M205 289 V330" class="line"/><path d="M205 404 V455" class="line"/><path d="M205 565 V620" class="line"/>

  <rect x="390" y="145" width="760" height="610" rx="24" class="cluster"/>
  <text x="420" y="180" class="section">AEGIS VPC 10.10.0.0/16 · US-EAST-1</text>
  <rect x="420" y="205" width="700" height="410" rx="22" class="eks"/>
  <text x="450" y="240" class="section">AMAZON EKS · PRIVATE WORKERS · MULTI-AZ</text>

  <rect x="455" y="275" width="210" height="88" rx="16" class="box"/><text x="560" y="307" text-anchor="middle" class="label">Status-Page</text><text x="560" y="330" text-anchor="middle" class="small">multiple web replicas</text><text x="560" y="348" text-anchor="middle" class="small">probes + PDB + topology spread</text>
  <rect x="455" y="405" width="210" height="88" rx="16" class="box"/><text x="560" y="437" text-anchor="middle" class="label">Human Review</text><text x="560" y="460" text-anchor="middle" class="small">staff-only analyst console</text><text x="560" y="478" text-anchor="middle" class="small">conditional verdict update</text>
  <rect x="705" y="275" width="180" height="88" rx="16" class="sec"/><text x="795" y="307" text-anchor="middle" class="label">AEGIS Analyzer</text><text x="795" y="330" text-anchor="middle" class="small">Pod Identity</text><text x="795" y="348" text-anchor="middle" class="small">schema validation</text>
  <rect x="920" y="275" width="165" height="88" rx="16" class="git"/><text x="1002" y="307" text-anchor="middle" class="label">Argo CD</text><text x="1002" y="330" text-anchor="middle" class="small">GitOps reconciliation</text><text x="1002" y="348" text-anchor="middle" class="small">AppProject constrained</text>
  <rect x="705" y="405" width="180" height="88" rx="16" class="box"/><text x="795" y="437" text-anchor="middle" class="label">RQ Runtime</text><text x="795" y="460" text-anchor="middle" class="small">2 workers</text><text x="795" y="478" text-anchor="middle" class="small">singleton scheduler</text>
  <rect x="920" y="405" width="165" height="88" rx="16" class="obs"/><text x="1002" y="437" text-anchor="middle" class="label">Observability</text><text x="1002" y="460" text-anchor="middle" class="small">Prometheus + Grafana</text><text x="1002" y="478" text-anchor="middle" class="small">Platform Health</text>
  <rect x="705" y="525" width="380" height="62" rx="14" class="box"/><text x="895" y="552" text-anchor="middle" class="label">ExternalDNS + Dynu webhook</text><text x="895" y="574" text-anchor="middle" class="small">exact CNAME discovery · deliberate --dry-run safety mode</text>
  <path d="M355 661 H420 V319 H455" class="line"/><path d="M560 363 V405" class="line"/>

  <rect x="450" y="650" width="300" height="75" rx="16" class="data"/><text x="600" y="680" text-anchor="middle" class="label">RDS PostgreSQL</text><text x="600" y="703" text-anchor="middle" class="small">Multi-AZ · managed data plane</text>
  <rect x="790" y="650" width="300" height="75" rx="16" class="data"/><text x="940" y="680" text-anchor="middle" class="label">ElastiCache Redis</text><text x="940" y="703" text-anchor="middle" class="small">Multi-AZ · TLS · failover</text>
  <path d="M560 363 V630 H600 V650" class="muted"/><path d="M580 363 V620 H940 V650" class="muted"/>

  <rect x="1185" y="145" width="360" height="610" rx="24" class="cluster"/>
  <text x="1215" y="180" class="section">AWS SECURITY &amp; CONTROL SERVICES</text>
  <rect x="1220" y="220" width="290" height="82" rx="16" class="aws"/><text x="1365" y="252" text-anchor="middle" class="label">Amazon Bedrock</text><text x="1365" y="276" text-anchor="middle" class="small">Nova Pro · advisory classification</text>
  <rect x="1220" y="340" width="290" height="82" rx="16" class="data"/><text x="1365" y="372" text-anchor="middle" class="label">DynamoDB Findings</text><text x="1365" y="396" text-anchor="middle" class="small">conditional writes · PITR</text>
  <rect x="1220" y="460" width="290" height="82" rx="16" class="obs"/><text x="1365" y="492" text-anchor="middle" class="label">CloudWatch</text><text x="1365" y="516" text-anchor="middle" class="small">WAF · ALB · alarms · AI quality</text>
  <rect x="1220" y="580" width="290" height="82" rx="16" class="git"/><text x="1365" y="612" text-anchor="middle" class="label">Immutable Amazon ECR</text><text x="1365" y="636" text-anchor="middle" class="small">digest-pinned application image</text>
  <path d="M885 319 H1180 V261 H1220" class="line"/><path d="M665 449 H1160 V381 H1220" class="line"/><path d="M885 319 H1170 V501 H1220" class="muted"/><path d="M1220 621 H1110 V319 H1085" class="muted"/>

  <rect x="390" y="795" width="1155" height="92" rx="20" class="git"/>
  <text x="420" y="827" class="section">IMMUTABLE DELIVERY &amp; DECLARED STATE</text>
  <text x="420" y="858" class="label">GitHub Actions + OIDC</text><text x="610" y="858" class="small">validate · Trivy gate · SBOM · publish ECR digest</text>
  <text x="940" y="858" class="label">Git desired state</text><text x="1105" y="858" class="small">→ Argo CD → EKS</text>
  <path d="M830 842 H915" class="line"/><path d="M1365 662 V780 H1002 V795" class="muted"/>

  <text x="70" y="910" class="small">Safety boundary: AI is advisory, ExternalDNS is non-mutating in the accepted state, and CI has no direct EKS deployment authority.</text>
</svg>