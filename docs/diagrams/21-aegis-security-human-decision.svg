<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">AEGIS security signal to human decision architecture</title>
  <desc id="desc">Security event pipeline from AWS WAF and CloudWatch through EventBridge, SQS, the AEGIS analyzer, Amazon Bedrock, validation, DynamoDB and protected human review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#08101d"/><stop offset="1" stop-color="#10111f"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#67e8f9"/></marker>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.label{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.small{font:400 12.5px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.step{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.4px;fill:#67e8f9}.box{fill:#111c2e;stroke:#334155;stroke-width:1.5}.edge{fill:#24151a;stroke:#fb7185;stroke-width:1.5}.aws{fill:#24180b;stroke:#f59e0b;stroke-width:1.5}.ai{fill:#1b1630;stroke:#a78bfa;stroke-width:1.5}.human{fill:#10251c;stroke:#4ade80;stroke-width:1.7}.data{fill:#151629;stroke:#818cf8;stroke-width:1.5}.line{stroke:#67e8f9;stroke-width:2.4;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#m)}
    </style>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <circle cx="1420" cy="95" r="170" fill="#a78bfa" opacity=".055"/><circle cx="130" cy="680" r="190" fill="#fb7185" opacity=".04"/>
  <text x="70" y="68" class="title">Security Signal → AI Analysis → Human Decision</text>
  <text x="70" y="98" class="sub">AEGIS treats telemetry and model output as untrusted data; only a staff analyst can finalize the verdict.</text>

  <text x="72" y="158" class="step">01 · EDGE DETECTION</text>
  <rect x="70" y="185" width="170" height="88" rx="16" class="box"/><text x="155" y="218" text-anchor="middle" class="label">Internet Request</text><text x="155" y="243" text-anchor="middle" class="small">normal or malicious</text>
  <rect x="285" y="185" width="205" height="88" rx="16" class="edge"/><text x="387" y="214" text-anchor="middle" class="label">ALB + AWS WAF</text><text x="387" y="238" text-anchor="middle" class="small">managed rules + rate controls</text><text x="387" y="256" text-anchor="middle" class="small">BLOCK telemetry at edge</text>
  <path d="M240 229 H285" class="line"/>

  <text x="545" y="158" class="step">02 · EVENT DELIVERY</text>
  <rect x="545" y="185" width="180" height="88" rx="16" class="aws"/><text x="635" y="214" text-anchor="middle" class="label">CloudWatch Alarm</text><text x="635" y="238" text-anchor="middle" class="small">BlockedRequests signal</text><text x="635" y="256" text-anchor="middle" class="small">operational trigger</text>
  <rect x="765" y="185" width="160" height="88" rx="16" class="aws"/><text x="845" y="218" text-anchor="middle" class="label">EventBridge</text><text x="845" y="243" text-anchor="middle" class="small">event routing</text>
  <rect x="965" y="185" width="175" height="88" rx="16" class="aws"/><text x="1052" y="214" text-anchor="middle" class="label">SQS</text><text x="1052" y="238" text-anchor="middle" class="small">security-events</text><text x="1052" y="256" text-anchor="middle" class="small">buffer + retry</text>
  <path d="M490 229 H545" class="line"/><path d="M725 229 H765" class="line"/><path d="M925 229 H965" class="line"/>

  <rect x="965" y="328" width="175" height="68" rx="15" class="edge"/><text x="1052" y="355" text-anchor="middle" class="label">Dead-letter Queue</text><text x="1052" y="377" text-anchor="middle" class="small">maxReceiveCount exceeded</text>
  <path d="M1052 273 V328" class="dash"/>

  <text x="1195" y="158" class="step">03 · ANALYZE</text>
  <rect x="1195" y="185" width="190" height="88" rx="16" class="box"/><text x="1290" y="214" text-anchor="middle" class="label">AEGIS Analyzer</text><text x="1290" y="238" text-anchor="middle" class="small">EKS Pod Identity</text><text x="1290" y="256" text-anchor="middle" class="small">WAF event enrichment</text>
  <rect x="1425" y="185" width="125" height="88" rx="16" class="ai"/><text x="1487" y="214" text-anchor="middle" class="label">Bedrock</text><text x="1487" y="238" text-anchor="middle" class="small">Nova Pro</text><text x="1487" y="256" text-anchor="middle" class="small">advisory only</text>
  <path d="M1140 229 H1195" class="line"/><path d="M1385 229 H1425" class="line"/>

  <text x="265" y="465" class="step">04 · VALIDATE &amp; PERSIST</text>
  <rect x="265" y="492" width="235" height="92" rx="16" class="ai"/><text x="382" y="523" text-anchor="middle" class="label">Output Validation</text><text x="382" y="547" text-anchor="middle" class="small">JSON parse · schema checks</text><text x="382" y="565" text-anchor="middle" class="small">semantic guardrails</text>
  <rect x="555" y="492" width="235" height="92" rx="16" class="data"/><text x="672" y="523" text-anchor="middle" class="label">DynamoDB Findings</text><text x="672" y="547" text-anchor="middle" class="small">conditional PutItem</text><text x="672" y="565" text-anchor="middle" class="small">idempotent persistence + PITR</text>
  <path d="M1487 273 V430 H382 V492" class="line"/><path d="M500 538 H555" class="line"/>

  <text x="855" y="465" class="step">05 · HUMAN GOVERNANCE</text>
  <rect x="855" y="492" width="250" height="92" rx="16" class="human"/><text x="980" y="523" text-anchor="middle" class="label">Protected Analyst Workspace</text><text x="980" y="547" text-anchor="middle" class="small">authenticated staff review</text><text x="980" y="565" text-anchor="middle" class="small">AI evidence separated from verdict</text>
  <rect x="1160" y="492" width="200" height="92" rx="16" class="human"/><text x="1260" y="523" text-anchor="middle" class="label">Final Verdict</text><text x="1260" y="547" text-anchor="middle" class="small">CORRECT / INCORRECT</text><text x="1260" y="565" text-anchor="middle" class="small">conditional one-time update</text>
  <rect x="1410" y="492" width="140" height="92" rx="16" class="aws"/><text x="1480" y="523" text-anchor="middle" class="label">AI Quality</text><text x="1480" y="547" text-anchor="middle" class="small">CloudWatch</text><text x="1480" y="565" text-anchor="middle" class="small">feedback metrics</text>
  <path d="M790 538 H855" class="line"/><path d="M1105 538 H1160" class="line"/><path d="M1360 538 H1410" class="line"/>

  <rect x="70" y="492" width="145" height="92" rx="16" class="box"/><text x="142" y="523" text-anchor="middle" class="label">Allowed Traffic</text><text x="142" y="547" text-anchor="middle" class="small">Status-Page</text><text x="142" y="565" text-anchor="middle" class="small">on EKS</text>
  <path d="M387 273 V430 H142 V492" class="dash"/>

  <rect x="70" y="642" width="1480" height="62" rx="18" fill="#0c1726" stroke="#334155"/>
  <text x="95" y="668" class="step">TRUST BOUNDARY</text><text x="245" y="668" class="small">Telemetry and Bedrock output are never trusted blindly.</text>
  <text x="245" y="690" class="small">Persistence must succeed before SQS acknowledgement, and AI has no infrastructure mutation authority.</text>
</svg>