<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">AEGIS multi-AZ resilience and observability architecture</title>
  <desc id="desc">Amazon EKS workload distribution across two Availability Zones, disruption controls, managed PostgreSQL and Redis, Karpenter recovery, and complementary Prometheus Grafana and CloudWatch observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset="1" stop-color="#0b1422"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#67e8f9"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#4ade80"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.section{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.5px;fill:#cbd5e1}.label{font:700 15.5px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.small{font:400 12.5px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.cluster{fill:#0b1727;stroke:#334155;stroke-width:2}.az{fill:#0b1c2c;stroke:#38bdf8;stroke-width:1.7}.box{fill:#111c2e;stroke:#334155;stroke-width:1.5}.green{fill:#10251c;stroke:#4ade80;stroke-width:1.5}.obs{fill:#0d2020;stroke:#2dd4bf;stroke-width:1.5}.data{fill:#151629;stroke:#a78bfa;stroke-width:1.5}.aws{fill:#24180b;stroke:#f59e0b;stroke-width:1.5}.line{stroke:#67e8f9;stroke-width:2.2;fill:none;marker-end:url(#a)}.good{stroke:#4ade80;stroke-width:2.2;fill:none;marker-end:url(#g)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="190" fill="#2dd4bf" opacity=".05"/><circle cx="120" cy="790" r="180" fill="#38bdf8" opacity=".04"/>
  <text x="70" y="68" class="title">Multi-AZ Resilience &amp; Observability</text>
  <text x="70" y="98" class="sub">AEGIS is designed to tolerate workload restarts, voluntary disruption and node pressure while keeping platform health observable.</text>

  <rect x="55" y="140" width="1010" height="565" rx="24" class="cluster"/>
  <text x="85" y="176" class="section">AMAZON EKS · PRIVATE WORKERS · TWO AVAILABILITY ZONES</text>
  <rect x="85" y="205" width="270" height="78" rx="16" class="box"/><text x="220" y="236" text-anchor="middle" class="label">ALB / Ingress</text><text x="220" y="260" text-anchor="middle" class="small">→ Status-Page Service :8080</text>
  <rect x="405" y="205" width="270" height="78" rx="16" class="green"/><text x="540" y="236" text-anchor="middle" class="label">Availability Controls</text><text x="540" y="260" text-anchor="middle" class="small">PDB · probes · topology spread</text>
  <rect x="725" y="205" width="270" height="78" rx="16" class="aws"/><text x="860" y="236" text-anchor="middle" class="label">Karpenter Recovery</text><text x="860" y="260" text-anchor="middle" class="small">Spot + On-Demand capacity</text>

  <rect x="85" y="320" width="430" height="235" rx="20" class="az"/>
  <text x="110" y="352" class="section">AVAILABILITY ZONE A</text>
  <rect x="115" y="380" width="170" height="72" rx="15" class="box"/><text x="200" y="409" text-anchor="middle" class="label">Worker Node A</text><text x="200" y="432" text-anchor="middle" class="small">private subnet</text>
  <rect x="315" y="380" width="170" height="72" rx="15" class="green"/><text x="400" y="409" text-anchor="middle" class="label">Web Replica A</text><text x="400" y="432" text-anchor="middle" class="small">Ready + probed</text>
  <rect x="115" y="470" width="170" height="62" rx="15" class="obs"/><text x="200" y="496" text-anchor="middle" class="label">node-exporter</text><text x="200" y="517" text-anchor="middle" class="small">cluster-critical priority</text>
  <path d="M285 416 H315" class="good"/>

  <rect x="565" y="320" width="430" height="235" rx="20" class="az"/>
  <text x="590" y="352" class="section">AVAILABILITY ZONE B</text>
  <rect x="595" y="380" width="170" height="72" rx="15" class="box"/><text x="680" y="409" text-anchor="middle" class="label">Worker Node B</text><text x="680" y="432" text-anchor="middle" class="small">private subnet</text>
  <rect x="795" y="380" width="170" height="72" rx="15" class="green"/><text x="880" y="409" text-anchor="middle" class="label">Web Replica B</text><text x="880" y="432" text-anchor="middle" class="small">Ready + probed</text>
  <rect x="595" y="470" width="170" height="62" rx="15" class="obs"/><text x="680" y="496" text-anchor="middle" class="label">node-exporter</text><text x="680" y="517" text-anchor="middle" class="small">cluster-critical priority</text>
  <path d="M765 416 H795" class="good"/>

  <path d="M355 244 H380 V416 H315" class="line"/><path d="M355 244 H780 V416 H795" class="line"/>
  <path d="M540 283 V300 H400 V380" class="dash"/><path d="M540 300 H880 V380" class="dash"/>
  <path d="M860 283 V300 H680 V380" class="dash"/>

  <rect x="85" y="585" width="280" height="86" rx="16" class="box"/><text x="225" y="616" text-anchor="middle" class="label">RQ Workers</text><text x="225" y="640" text-anchor="middle" class="small">2 replicas + PDB</text><text x="225" y="658" text-anchor="middle" class="small">recoverable scheduling capacity</text>
  <rect x="405" y="585" width="280" height="86" rx="16" class="box"/><text x="545" y="616" text-anchor="middle" class="label">RQ Scheduler</text><text x="545" y="640" text-anchor="middle" class="small">singleton + Recreate</text><text x="545" y="658" text-anchor="middle" class="small">avoids duplicate scheduling</text>
  <rect x="725" y="585" width="270" height="86" rx="16" class="obs"/><text x="860" y="616" text-anchor="middle" class="label">Kubernetes Telemetry</text><text x="860" y="640" text-anchor="middle" class="small">workloads + nodes + state</text><text x="860" y="658" text-anchor="middle" class="small">Prometheus scrape targets</text>

  <rect x="1110" y="140" width="435" height="565" rx="24" class="cluster"/>
  <text x="1140" y="176" class="section">MANAGED DATA &amp; OBSERVABILITY</text>
  <rect x="1145" y="205" width="365" height="78" rx="16" class="data"/><text x="1327" y="236" text-anchor="middle" class="label">RDS PostgreSQL Multi-AZ</text><text x="1327" y="260" text-anchor="middle" class="small">managed persistence outside the cluster</text>
  <rect x="1145" y="310" width="365" height="78" rx="16" class="data"/><text x="1327" y="341" text-anchor="middle" class="label">ElastiCache Redis Multi-AZ</text><text x="1327" y="365" text-anchor="middle" class="small">TLS + managed failover</text>
  <path d="M965 416 H1080 V244 H1145" class="line"/><path d="M880 452 H1080 V349 H1145" class="line"/>

  <rect x="1145" y="430" width="170" height="92" rx="16" class="obs"/><text x="1230" y="460" text-anchor="middle" class="label">Prometheus</text><text x="1230" y="484" text-anchor="middle" class="small">K8s + node metrics</text><text x="1230" y="502" text-anchor="middle" class="small">namespace visibility</text>
  <rect x="1340" y="430" width="170" height="92" rx="16" class="obs"/><text x="1425" y="460" text-anchor="middle" class="label">Grafana</text><text x="1425" y="484" text-anchor="middle" class="small">AEGIS Platform Health</text><text x="1425" y="502" text-anchor="middle" class="small">staff-protected workspace</text>
  <path d="M995 628 H1080 V476 H1145" class="line"/><path d="M1315 476 H1340" class="good"/>

  <rect x="1145" y="555" width="365" height="96" rx="16" class="aws"/><text x="1327" y="586" text-anchor="middle" class="label">CloudWatch</text><text x="1327" y="610" text-anchor="middle" class="small">WAF · ALB · event pipeline · AI quality</text><text x="1327" y="631" text-anchor="middle" class="small">complements Prometheus/Grafana</text>

  <rect x="55" y="744" width="1490" height="70" rx="18" fill="#0c1726" stroke="#334155"/>
  <text x="85" y="774" class="section">VALIDATED RESILIENCE POSTURE</text>
  <text x="285" y="774" class="small">multiple Ready replicas across AZs · disruption budgets · readiness/liveness probes · Karpenter capacity recovery · protected node telemetry · managed database/cache failover</text>
  <text x="285" y="797" class="small">Boundaries remain explicit: no multi-region claim, no HA Argo CD claim, and no active Status-Page HPA claim.</text>
</svg>