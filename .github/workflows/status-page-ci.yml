name: AEGIS Status-Page Secure CI

on:
  push:
    branches:
      - main
    paths:
      - "status-page/**"
      - "gitops/eks-dev/render-configuration.py"

  pull_request:
    branches:
      - main
    paths:
      - "status-page/**"
      - ".github/workflows/status-page-ci.yml"
      - "gitops/eks-dev/render-configuration.py"

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "992382545251"
  ECR_REPOSITORY: aegis-eks-dev-status-page
  ECR_REGISTRY: 992382545251.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::992382545251:role/aegis-eks-dev-github-ci

concurrency:
  group: status-page-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # =========================================================
  # CI VALIDATION
  # Runs for both Pull Requests and pushes.
  # Has no AWS permissions.
  # =========================================================

  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify required build inputs
        run: |
          test -f status-page/Dockerfile
          test -f status-page/statuspage/manage.py
          test -f status-page/local_requirements.txt
          test -f gitops/eks-dev/render-configuration.py

          echo "All required CI build inputs are present."

      - name: Validate AEGIS plugin Python
        run: |
          python3 -m compileall \
            status-page/statuspage/aegis_review

      - name: Validate runtime configuration renderer
        run: |
          python3 -m py_compile \
            gitops/eks-dev/render-configuration.py

      - name: Build Status-Page container
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t aegis-status-page:ci \
            status-page

      # Visibility scan:
      # HIGH and CRITICAL findings are shown in CI.
      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegis-status-page:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: "0"

      # Security gate:
      # A fixable CRITICAL vulnerability blocks delivery.
      - name: Trivy CRITICAL security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegis-status-page:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: "1"


  # =========================================================
  # SECURE DELIVERY
  #
  # Runs only for trusted pushes/workflow_dispatch.
  #
  # GitHub gets temporary AWS credentials through OIDC.
  # It has ECR permissions only and NO EKS permissions.
  # =========================================================

  publish:
    name: Publish Immutable Image
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: aegis-github-${{ github.run_id }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" \
          | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Define immutable image tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="git-${GITHUB_SHA:0:12}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Image URI: $IMAGE_URI"

      # Idempotent ECR delivery:
      # Reuse an existing immutable image when this Git commit
      # has already been published.
      - name: Check for existing immutable ECR image
        id: ecr
        shell: bash
        run: |
          set +e

          EXISTING_DIGEST=$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              2>ecr-error.txt
          )

          STATUS=$?

          set -e

          if [ "$STATUS" -eq 0 ]; then
            if [[ ! "$EXISTING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unexpected ECR digest: $EXISTING_DIGEST"
              exit 1
            fi

            echo "Immutable image already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$EXISTING_DIGEST" >> "$GITHUB_OUTPUT"

          elif grep -q "ImageNotFoundException" ecr-error.txt; then
            echo "Immutable image does not exist yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"

          else
            echo "Unexpected ECR error:"
            cat ecr-error.txt
            exit "$STATUS"
          fi

          rm -f ecr-error.txt

      - name: Pull existing immutable image
        if: steps.ecr.outputs.exists == 'true'
        run: |
          docker pull "$IMAGE_URI"

      - name: Build immutable production image
        if: steps.ecr.outputs.exists != 'true'
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE_URI" \
            status-page

      - name: Trivy production image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: "1"

      # Software Bill of Materials for the exact release image.
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: cyclonedx
          output: aegis-status-page-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-status-page-sbom-${{ github.sha }}
          path: aegis-status-page-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Push image to ECR
        if: steps.ecr.outputs.exists != 'true'
        run: |
          docker push "$IMAGE_URI"

      - name: Resolve immutable ECR digest
        id: digest
        shell: bash
        env:
          IMAGE_EXISTS: ${{ steps.ecr.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.ecr.outputs.digest }}
        run: |
          if [ "$IMAGE_EXISTS" = "true" ]; then
            DIGEST="$EXISTING_DIGEST"
            echo "Reusing existing immutable digest: $DIGEST"
          else
            DIGEST=$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="$IMAGE_TAG" \
                --region "$AWS_REGION" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid ECR digest: $DIGEST"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Immutable digest: $DIGEST"

      # GitOps hand-off:
      # CI changes Git only. It never talks to Kubernetes/EKS.
      #
      # Safely synchronize with the latest remote branch before
      # mutating desired state. A stale rerun must never overwrite
      # newer application changes.
      - name: Synchronize GitOps branch safely
        shell: bash
        run: |
          git fetch             origin             "$GITHUB_REF_NAME"

          REMOTE_REF="origin/$GITHUB_REF_NAME"

          CHANGED_FILES=$(
            git diff               --name-only               "$GITHUB_SHA..$REMOTE_REF"
          )

          if [ -n "$CHANGED_FILES" ]; then
            echo "Remote branch advanced since this workflow started:"
            echo "$CHANGED_FILES"

            UNSAFE_FILES=$(
              echo "$CHANGED_FILES"               | grep -v '^gitops/eks-dev/kustomization.yaml$'               || true
            )

            if [ -n "$UNSAFE_FILES" ]; then
              echo "Refusing stale GitOps deployment."
              echo "Remote contains newer non-GitOps changes:"
              echo "$UNSAFE_FILES"
              exit 1
            fi
          fi

          git checkout             -B "$GITHUB_REF_NAME"             "$REMOTE_REF"

          echo "GitOps branch synchronized safely."

      - name: Update GitOps image digest
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/eks-dev/kustomization.yaml")
          text = path.read_text()

          digest = os.environ["DIGEST"]

          updated, count = re.subn(
              r"(?m)^(\s*digest:\s*)sha256:[0-9a-f]{64}\s*$",
              rf"\g<1>{digest}",
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one digest field, updated {count}"
              )

          path.write_text(updated)
          PY

          grep -A4 '^images:' \
            gitops/eks-dev/kustomization.yaml

      - name: Package protected GitOps promotion
        id: promotion
        shell: bash
        run: |
          if git diff --quiet -- gitops/eks-dev/kustomization.yaml; then
            echo "GitOps already references this digest."
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff -- \
            gitops/eks-dev/kustomization.yaml \
            > aegis-status-page-gitops.patch

          test -s aegis-status-page-gitops.patch

          echo "required=true" >> "$GITHUB_OUTPUT"
          echo "Protected GitOps promotion artifact prepared."

      - name: Upload protected GitOps promotion
        if: steps.promotion.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-status-page-gitops-${{ github.sha }}
          path: |
            aegis-status-page-gitops.patch
            gitops/eks-dev/kustomization.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Delivery summary
        env:
          PROMOTION_REQUIRED: ${{ steps.promotion.outputs.required }}
        run: |
          echo "======================================"
          echo "AEGIS SECURE ARTIFACT DELIVERY COMPLETE"
          echo "======================================"
          echo "Image tag:    $IMAGE_TAG"
          echo "Image URI:    $IMAGE_URI"
          echo "Image digest: ${{ steps.digest.outputs.digest }}"
          echo
          echo "GitHub Actions did NOT access EKS."

          if [ "$PROMOTION_REQUIRED" = "true" ]; then
            echo "GitOps promotion requires a protected pull request."
            echo "Download the GitOps promotion artifact from this run."
            echo "::notice title=Protected GitOps promotion required::Download the GitOps artifact and promote the digest through a reviewed pull request."

            {
              echo "### Protected GitOps promotion required"
              echo
              echo "The immutable image and SBOM were published successfully."
              echo "Download the GitOps promotion artifact from this run and apply it through a pull request to main."
              echo
              echo "GitHub Actions did not access EKS or bypass branch protection."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitOps already references this immutable digest."
          fi

          echo "Argo CD reconciles only reviewed Git -> EKS."
