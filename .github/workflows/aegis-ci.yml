name: AEGIS Python CI

on:
  push:
    paths:
      - "aegis/**"
      - ".github/workflows/aegis-ci.yml"

  pull_request:
    paths:
      - "aegis/**"
      - ".github/workflows/aegis-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aegis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: aegis/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install AEGIS
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v
