name: AEGIS Python CI

on:
  push:
    paths:
      - "aegis/**"
      - ".github/workflows/aegis-ci.yml"

  pull_request:
    paths:
      - "aegis/**"
      - ".github/workflows/aegis-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aegis

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: aegis/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install AEGIS
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v
